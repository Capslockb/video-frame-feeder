name: cli-smoke

on:
  push:
    paths:
      - video-frame-feeder.py
      - tests/**
      - .github/workflows/cli-smoke.yml
  pull_request:
    paths:
      - video-frame-feeder.py
      - tests/**
      - .github/workflows/cli-smoke.yml

permissions:
  contents: read

jobs:
  cli-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile feeder
        run: python -m py_compile video-frame-feeder.py
      - name: Run CLI parser smoke tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
