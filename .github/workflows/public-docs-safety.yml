name: public-docs-safety

on:
  pull_request: {}
  pull_request_target: {}
  push:
    branches: [ main, master, release/** ]
    paths:
      - '**'
      - README
      - '**/README'
      - README.md
      - '**/README.md'
      - README.mdx
      - '**/README.mdx'
      - README.rst
      - '**/README.rst'
      - README.txt
      - '**/README.txt'
      - README.html
      - '**/README.html'
      - README.htm
      - '**/README.htm'
      - README.adoc
      - '**/README.adoc'
      - README.asciidoc
      - '**/README.asciidoc'
      - RESEARCH.md
      - '**/RESEARCH.md'
      - SECURITY.md
      - '**/SECURITY.md'
      - CONTRIBUTING.md
      - '**/CONTRIBUTING.md'
      - CODE_OF_CONDUCT.md
      - '**/CODE_OF_CONDUCT.md'
      - '*.md'
      - '*.MD'
      - '*.Md'
      - '*.mD'
      - '.github/*.md'
      - '.github/*.MD'
      - '.github/*.Md'
      - '.github/*.mD'
      - SUPPORT.md
      - '**/SUPPORT.md'
      - GOVERNANCE.md
      - '**/GOVERNANCE.md'
      - AGENTS.md
      - '**/AGENTS.md'
      - CODEOWNERS
      - '**/CODEOWNERS'
      - pull_request_template.*
      - PULL_REQUEST_TEMPLATE.*
      - pull_request_template/**
      - PULL_REQUEST_TEMPLATE/**
      - docs/pull_request_template.*
      - docs/PULL_REQUEST_TEMPLATE.*
      - docs/pull_request_template/**
      - docs/PULL_REQUEST_TEMPLATE/**
      - .github/pull_request_template.md
      - .github/PULL_REQUEST_TEMPLATE.md
      - .github/pull_request_template.*
      - .github/PULL_REQUEST_TEMPLATE.*
      - .github/pull_request_template/**
      - .github/PULL_REQUEST_TEMPLATE/**
      - .github/issue_template.md
      - .github/ISSUE_TEMPLATE.md
      - .github/issue_template/**
      - .github/ISSUE_TEMPLATE/**
      - issue_template/**
      - ISSUE_TEMPLATE/**
      - docs/issue_template/**
      - docs/ISSUE_TEMPLATE/**
      - docs/**
      - '**/docs/**'
      - doc/**
      - '**/doc/**'
      - website/**
      - '**/website/**'
      - site/**
      - '**/site/**'
      - public/**
      - '**/public/**'
      - docs-site/**
      - '**/docs-site/**'
      - .github/CODEOWNERS
      - .github/workflows/public-docs-safety.yml
      - scripts/public_docs_safety.py
      - tests/test_public_docs_safety*.py
      - tests/fixtures/public-docs/**

permissions:
  contents: read

jobs:
  candidate-public-docs-safety:
    if: github.event_name == 'pull_request'
    name: public-docs-safety
    runs-on: ubuntu-latest
    steps:
      - name: check out exact candidate head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: fetch trusted base history for comparison
        env:
          BASE_REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags "https://github.com/${BASE_REPOSITORY}.git" "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: scan exact candidate head
        run: python3 scripts/public_docs_safety.py
      - name: run candidate validator regressions
        run: |
          python3 -m unittest tests.test_public_docs_safety
          python3 -m unittest tests.test_public_docs_safety_formats
          python3 -m unittest tests.test_public_docs_safety_push_regressions
          python3 -m unittest tests.test_public_docs_safety_quoted
          python3 -m unittest tests.test_public_docs_safety_scope
          python3 -m unittest tests.test_public_docs_safety_casefold
          python3 -m unittest tests.test_public_docs_safety_structural_boundaries
          python3 -m unittest tests.test_public_docs_safety_workflow_trust

  trusted-public-docs-safety:
    if: github.event_name == 'pull_request_target'
    name: public-docs-safety-trusted
    runs-on: ubuntu-latest
    steps:
      - name: check out trusted validator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
      - name: check out untrusted candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: fetch trusted base history for comparison
        working-directory: candidate
        env:
          BASE_REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags "https://github.com/${BASE_REPOSITORY}.git" "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: scan candidate with trusted validator
        working-directory: candidate
        env:
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python3 ../trusted/scripts/public_docs_safety.py
      - name: run trusted validator regressions
        working-directory: trusted
        run: |
          python3 -m unittest tests.test_public_docs_safety
          python3 -m unittest tests.test_public_docs_safety_formats
          python3 -m unittest tests.test_public_docs_safety_push_regressions
          python3 -m unittest tests.test_public_docs_safety_quoted
          python3 -m unittest tests.test_public_docs_safety_scope
          python3 -m unittest tests.test_public_docs_safety_casefold
          python3 -m unittest tests.test_public_docs_safety_structural_boundaries
          python3 -m unittest tests.test_public_docs_safety_workflow_trust

  pushed-public-docs-safety:
    if: github.event_name == 'push'
    name: public-docs-safety
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: check out pushed revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: fetch default branch for new-branch comparisons
        if: github.event.created
        run: git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: scan pushed revision
        run: python3 scripts/public_docs_safety.py
      - name: run pushed-revision validator regressions
        run: |
          python3 -m unittest tests.test_public_docs_safety
          python3 -m unittest tests.test_public_docs_safety_formats
          python3 -m unittest tests.test_public_docs_safety_push_regressions
          python3 -m unittest tests.test_public_docs_safety_quoted
          python3 -m unittest tests.test_public_docs_safety_scope
          python3 -m unittest tests.test_public_docs_safety_casefold
          python3 -m unittest tests.test_public_docs_safety_structural_boundaries
          python3 -m unittest tests.test_public_docs_safety_workflow_trust
