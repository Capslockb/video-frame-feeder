name: public-docs-safety

on:
  pull_request: {}
  push:
    branches: [ main, master, release/** ]
    paths:
      - README
      - '**/README'
      - README.md
      - '**/README.md'
      - README.mdx
      - '**/README.mdx'
      - README.rst
      - '**/README.rst'
      - README.txt
      - '**/README.txt'
      - README.html
      - '**/README.html'
      - README.htm
      - '**/README.htm'
      - README.adoc
      - '**/README.adoc'
      - README.asciidoc
      - '**/README.asciidoc'
      - RESEARCH.md
      - '**/RESEARCH.md'
      - SECURITY.md
      - '**/SECURITY.md'
      - CONTRIBUTING.md
      - '**/CONTRIBUTING.md'
      - CODE_OF_CONDUCT.md
      - '**/CODE_OF_CONDUCT.md'
      - AGENTS.md
      - '**/AGENTS.md'
      - CODEOWNERS
      - '**/CODEOWNERS'
      - .github/pull_request_template.md
      - .github/PULL_REQUEST_TEMPLATE.md
      - .github/pull_request_template/**
      - .github/PULL_REQUEST_TEMPLATE/**
      - .github/issue_template.md
      - .github/ISSUE_TEMPLATE.md
      - .github/issue_template/*.md
      - .github/issue_template/**/*.md
      - .github/ISSUE_TEMPLATE/*.md
      - .github/ISSUE_TEMPLATE/**/*.md
      - issue_template/*.md
      - issue_template/**/*.md
      - ISSUE_TEMPLATE/*.md
      - ISSUE_TEMPLATE/**/*.md
      - docs/issue_template/*.md
      - docs/issue_template/**/*.md
      - docs/ISSUE_TEMPLATE/*.md
      - docs/ISSUE_TEMPLATE/**/*.md
      - docs/**
      - '**/docs/**'
      - doc/**
      - '**/doc/**'
      - website/**
      - '**/website/**'
      - site/**
      - '**/site/**'
      - public/**
      - '**/public/**'
      - docs-site/**
      - '**/docs-site/**'
      - .github/CODEOWNERS
      - .github/workflows/public-docs-safety.yml
      - scripts/public_docs_safety.py
      - tests/test_public_docs_safety*.py
      - tests/fixtures/public-docs/**

jobs:
  public-docs-safety:
    name: public-docs-safety
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: fetch default branch for new-branch comparisons
        if: github.event_name == 'push' && github.event.created
        run: git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: public-docs-safety
        run: python3 scripts/public_docs_safety.py
      - name: adversarial fixture unittest
        run: python3 -m unittest discover -s tests -p 'test_public_docs_safety*.py'
